# ---------------------------------------------------------------------------
# pyproject.toml — myocard-egm-studio
#
# Desktop application for the myocard-labs intracardiac-EGM stack: signal
# exploration, ML training-result diagnostics, and paper-figure generation.
# Reads data exclusively via egm-data / egm-contracts.
#
# Convention recap (LOCKED-IN 2026-06-13, see intracardiac-platform/project/refactor_checklist.md):
#   GitHub repo  : egm-studio                     (bare)
#   PyPI dist    : myocard-egm-studio             (myocard- prefix)
#   Import name  : myocard_egm_studio             (underscore)
#
# Implementation in progress (Blocks 2-4 shipped). The headless core:
# analysis / view_model / charts.matplotlib (recipe registry + paper style) /
# figures (render + bank loaders) / the egm-studio-render CLI, with all eight
# Phase-1.5 P0 recipes (prediction-histogram, feature-distribution-overlay,
# bar-chart-with-deltas, roc-curve-multi-line, calibration-reliability-diagram,
# trace-pair-gallery, summary-table, training-curve). The Block 4 Qt shell
# (gui/: app + shell + theme + preferences) adds the PySide6 layout, the 3-mode
# switch, and dark/light/vibrant themes with persistence; interactive views +
# pyqtgraph land in Blocks 5+. See project/roadmap.md for the block plan.
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-egm-studio"
version = "0.1.0"
description = "Desktop application for intracardiac EGM signal analysis, ML diagnostics, and paper-figure generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = [
  "cardiac",
  "electrophysiology",
  "signal-processing",
  "egm",
  "gui",
  "visualization",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
  # Schemas + typed models for every cross-component format (figure_spec,
  # phase_manifest, observation, bank/record schemas); the ArtifactId /
  # FigureId patterns live here. [ADR-001, ADR-014]
  "myocard-egm-contracts @ git+https://github.com/myocard-labs/egm-contracts.git@v0.5.2",
  # All bank + phase-artifact I/O: load_classifier_bank, phases.load_figure_spec,
  # etc. egm-studio never opens an HDF5/JSON directly [ADR-001]. No [torch]
  # extra — egm-studio neither trains nor runs models.
  "myocard-egm-data @ git+https://github.com/myocard-labs/egm-data.git@v0.4.2",
  # Per-trace feature extractors (bundle.extract_all) for the unified
  # per-trace view-model. [ADR-002]
  "myocard-egm-features @ git+https://github.com/myocard-labs/egm-features.git@v0.1.1",
  # Publication figure rendering via the headless Agg backend [ADR-016].
  "matplotlib>=3.8",
  # Imported by name in analysis/ + view_model/, so declared directly even
  # though they also arrive transitively via egm-features / egm-data.
  # numpy 2.5+ ships PEP 695 type-alias stubs mypy won't parse under
  # python_version="3.10"; cap below 2.5 to match the rest of the stack.
  "numpy>=1.26,<2.5",
  "pandas>=2.0",
  "scipy>=1.11",
  # Interactive desktop GUI stack [ADR-016], added in Block 4. PySide6 is the
  # Qt binding for the shell; pyqtgraph is the live trace-plotting backend
  # (Block 5+). Hard runtime deps of the GUI, but the headless figure path
  # (egm-studio-render) never imports them — pulling in charts/matplotlib or
  # figures/ imports neither.
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # Snapshot-test rendered figures against committed baseline PNGs.
  "pytest-mpl>=0.17",
  # GUI integration tests for the Qt shell [ADR-013]; runs headless under
  # offscreen QPA (CI uses xvfb).
  "pytest-qt>=4.4",
  "ruff>=0.6.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/egm-studio"
Repository    = "https://github.com/myocard-labs/egm-studio"
Issues        = "https://github.com/myocard-labs/egm-studio/issues"
Organization  = "https://github.com/myocard-labs"

[project.scripts]
# Headless figure renderer (Block 2).
egm-studio-render = "myocard_egm_studio.cli.render:main"
# Interactive desktop GUI [ADR-016], added in Block 4.
egm-studio = "myocard_egm_studio.gui.app:main"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

# Hatchling refuses direct URL references in dependencies by default; we
# need it during pre-1.0 iteration so we can pin the egm-* siblings to
# git tags. Drop this once everything ships on (Test)PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_egm_studio"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  # Add per-package allowlist below as needed, e.g.:
  # "ignore::DeprecationWarning:some_third_party_lib",
]

[tool.coverage.run]
source = ["src/myocard_egm_studio"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

# matplotlib + scipy + pandas ship without complete py.typed support;
# ignore-missing silences these third-party hops without losing strict
# checking on our own code. (pandas has a pandas-stubs package; like
# egm-features we don't pin it yet — a natural add when the DataFrame
# ergonomics get richer.) The myocard siblings (egm-contracts / egm-data /
# egm-features) ship py.typed and are deliberately NOT in this list — and
# neither is PySide6, which ships py.typed + stubs of its own. pyqtgraph ships
# no type information, so it joins the list (added Block 4).
[[tool.mypy.overrides]]
module = [
  "matplotlib.*",
  "scipy.*",
  "pandas.*",
  "pyqtgraph.*",
]
ignore_missing_imports = true
