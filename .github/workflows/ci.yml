name: CI

on:
  push:
    branches: [development, release]
  pull_request:
    branches: [development, release]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        # Pinned to the fleet version (CL-024 §1). Unpinned, CI resolved the newest
        # ruff at run time: 0.16 took Markdown formatting out of preview and began
        # reformatting Python blocks inside docs, so CI failed on files that
        # pre-commit (pinned to 0.15.17) never touched. Bump this and
        # .pre-commit-config.yaml together, fleet-wide.
        run: pip install "ruff==0.15.17"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Test — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 (a runtime dep since Block 4) dlopens Qt's system libraries, and
      # pytest-qt imports Qt at startup for every test run — so the headless
      # runner needs these even though the GUI tests use the offscreen platform.
      - name: Install Qt system libraries (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Fast/slow split: a push to `development` runs the fast set only (the pytest-qt
      # GUI tests each pay ~2-3 s of Qt startup, so the full suite is slow). PRs into
      # `release` and pushes to `release` run the full suite — so every merge to the
      # stable branch is gated by the GUI tests. Flip to always-full by dropping the
      # branch guard if late GUI-regression catching bites.
      - name: Run pytest (fast set on development pushes)
        if: github.event_name == 'push' && github.ref_name == 'development'
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest -m "not gui" --cov --cov-report=xml --cov-report=term

      - name: Run pytest (full suite on release + PRs)
        if: github.event_name != 'push' || github.ref_name != 'development'
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy
        run: mypy
